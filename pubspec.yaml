name: marsa_app
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  font_awesome_flutter: ^10.12.0
  flutter_svg: ^2.2.3
  get: ^4.7.3
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  fluttertoast: ^9.0.0
  path: ^1.9.1
  flutter_form_builder: ^10.2.0
  url_launcher: ^6.3.2
  url_launcher_linux: ^3.2.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4
  universal_html: ^2.3.0
  http: ^1.6.0
  # flutter_localization: ^0.3.3
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  dashed_border: ^1.0.0
  lottie: ^3.3.2
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true
  image_path: "assets/marsa/AppIcon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/marsa/AppIcon.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# بداية قسم فلاتر، انتبه للمسافات هنا بدقة
flutter:
  uses-material-design: true

  # 1. قسم الصور (assets)
  # يجب أن يكون بمسافة بادئة (2 مسافة) تحت flutter
  assets:
    - assets/ # للملفات الموجودة مباشرة داخل assets
    - assets/apartmentsImages/
    - assets/background/
    - assets/icons/
    - assets/marsa/

  # 2. قسم الخطوط (fonts)
  # يجب أن يكون بمسافة بادئة (2 مسافة) تحت flutter
  fonts:
    - family: Tajawal
      fonts:
        - asset: fonts/Tajawal-Regular.ttf
